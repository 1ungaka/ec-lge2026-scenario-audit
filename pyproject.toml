[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecaudit"
version = "0.1.0"
description = "Independent audit of pre-election scenarios and baselines for the Eastern Cape 2026 local elections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lunga Ngaka" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
